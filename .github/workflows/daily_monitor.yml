name: 海龟交易每日监控

on:
  schedule:
    # UTC 09:00 = 北京时间 17:00，仅工作日（留足时间等数据源更新）
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行监控并发送通知
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_SPREADSHEET: ${{ secrets.FEISHU_SPREADSHEET }}
        run: python turtle_notify.py
